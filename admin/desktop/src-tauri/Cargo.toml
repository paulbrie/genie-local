[package]
name = "spiridus-desktop"
version = "0.1.0"
description = "Spiridus Desktop: lets your Spiridus admin and its agents see and drive this computer"
edition = "2021"

[lib]
name = "spiridus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "fs"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
xcap = "0.9"
enigo = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
arboard = "3"
whoami = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
