# Public entrypoint (port 3000 is the exposed port). server_name is `_` so this
# serves whatever public host the box is reached at — nothing is hardcoded; the
# app's own origin allowlist (APP_PUBLIC_HOSTS) is what pins the domain.
server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    absolute_redirect off;   # relative redirects -> resolve to public https origin

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_buffering off;            # let HMR/SSE streams through (dev hot-reload)

    # Admin Next.js app (basePath /admin) on :3001, behind HTTP Basic Auth.
    location /admin {
        proxy_pass http://127.0.0.1:3001;
    }

    # Hot-reload dev instance (basePath /admin-dev) on :3002. nginx longest-prefix
    # matching sends /admin-dev* here and everything else under /admin* to :3001,
    # so the two never collide. Started on demand from the admin UI (admin-ctl).
    location /admin-dev {
        proxy_pass http://127.0.0.1:3002;
    }

    location = / { return 302 /admin; }

    # ROA backend API (server-app on :4111). The API is mounted at a bare
    # /api/v1 (no project prefix), so strip the mount path before proxying.
    # This gives the server-admin browser app a same-origin API URL. Kept here
    # (not in the generated projects.conf) so it survives port regeneration; the
    # longer prefix wins over projects.conf's `location /projects/roa/server-app`.
    location /projects/roa/server-app/api/ {
        proxy_pass http://127.0.0.1:4111/api/;
    }

    # Per-app live routes, GENERATED from the admin DB (apps.port).
    # Regenerated + reloaded whenever a port is edited in the admin UI.
    include /opt/project/admin/nginx/projects.conf;
}
