# Public entrypoint (port 3000 is the exposed port). server_name is `_` so this
# serves whatever public host the box is reached at — nothing is hardcoded; the
# app's own origin allowlist (APP_PUBLIC_HOSTS) is what pins the domain.
server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    absolute_redirect off;   # relative redirects -> resolve to public https origin
    client_max_body_size 100m;   # allow large uploads (e.g. project source zips)

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_buffering off;            # let HMR/SSE streams through (dev hot-reload)

    # Admin Next.js app (basePath /admin) on :3002, behind HTTP Basic Auth.
    location /admin {
        proxy_pass http://127.0.0.1:3002;
    }

    # Hot-reload dev instance (basePath /admin-dev) on :3003. nginx longest-prefix
    # matching sends /admin-dev* here and everything else under /admin* to :3002,
    # so the two never collide. Started on demand from the admin UI (admin-ctl).
    location /admin-dev {
        proxy_pass http://127.0.0.1:3003;
    }

    location = / { return 302 /admin; }

    # ROA backend API (server-app on :4111). The API is mounted at a bare
    # /api/v1 (no project prefix), so strip the mount path before proxying.
    # This gives the server-admin browser app a same-origin API URL. Kept here
    # (not in the generated projects.conf) so it survives port regeneration; the
    # longer prefix wins over projects.conf's `location /projects/roa/server-app`.
    location /projects/roa/server-app/api/ {
        proxy_pass http://127.0.0.1:4111/api/;
    }

    # oracle — a two-service app (Next.js web + Socket.IO/API server) that does
    # not fit the one-port projects.conf model, so both are routed here by hand
    # and kept out of the generated include. Longest-prefix wins, so the API
    # routes below take precedence over the web catch-all. oracle's apps.port is
    # left NULL so projects.conf never emits a conflicting /projects/oracle block.
    #   web UI (Next.js, basePath /projects/oracle) → :3020
    #   API server (Socket.IO path /projects/oracle/socket.io, OAuth, images) → :8080
    location /projects/oracle/socket.io/ {
        proxy_pass http://127.0.0.1:8080;   # no URI: preserve the full socket.io path
    }
    location /projects/oracle/auth/ {
        proxy_pass http://127.0.0.1:8080/auth/;         # strip the mount prefix
    }
    location /projects/oracle/screenshots/ {
        proxy_pass http://127.0.0.1:8080/screenshots/;  # strip the mount prefix
    }
    location /projects/oracle {
        proxy_pass http://127.0.0.1:3020;
    }

    # Per-app live routes, GENERATED from the admin DB (apps.port).
    # Regenerated + reloaded whenever a port is edited in the admin UI.
    include /opt/project/admin/nginx/projects.conf;
}
